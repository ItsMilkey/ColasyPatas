spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# URL (CORREGIDA)
# Se eliminó la parte "?TNS_ADMIN=C:/Users/..."
# El Dockerfile ahora se encarga de esto.
spring.datasource.url=jdbc:oracle:thin:@base1_high

spring.datasource.username=ColasPatas
spring.datasource.password=Ricardo123456

# logs debug
logging.level.org.hibernate=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.java.sql=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

#JPA-HIBERNATE
spring.jpa.hibernate.ddl-auto=update 
#update = desarollo ||  none = producción
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

